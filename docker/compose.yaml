# 스캔 PC 컨테이너. 저장소 루트에서:
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml run --rm station pytest -q            # 전체 테스트
#   docker compose -f docker/compose.yaml run --rm station tools/scan.sh --hello  # 로봇 연결
# 로봇 주소·사용자는 저장소 루트 .env(.env.example 복사, PINKY1_HOST, PINKY2_HOST, PINKY_USER)에서 읽는다.
services:
  station:
    image: scan3d-station:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /work
    stdin_open: true
    tty: true
    env_file:
      - path: ../.env
        required: false
    environment:
      # 호스트 SSH 에이전트(키는 컨테이너에 넣지 않음)
      SSH_AUTH_SOCK: /ssh-agent
      # Linux에서 메시 창을 띄우려면 DISPLAY를 넘기고 xhost +local:root
      DISPLAY: ${DISPLAY:-}
    volumes:
      - ..:/work
      # macOS Docker Desktop: /run/host-services/ssh-auth.sock, Linux: SSH_AGENT_SOCK=$SSH_AUTH_SOCK
      - ${SSH_AGENT_SOCK:-/run/host-services/ssh-auth.sock}:/ssh-agent
      - ssh-state:/root/.ssh/state
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

volumes:
  ssh-state:
