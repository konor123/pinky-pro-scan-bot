# 시뮬레이션용 설정(config/scan.yaml 기반: host 127.0.0.1, Gazebo 카메라 크기 1280x720).

board:
  layout: config/board.json      # 표식 배치(board 모듈이 만든다)
  tag_mm: 85                     # 인쇄한 표식 한 변(설계 85, 현장에서 잰 값으로 바꿈)

scene:
  r_obj: 0.14                    # 물체 바닥 윤곽을 감싸는 원 반지름
  place_err: 0.03                # 물체를 판 가운데 놓는 오차. r_eff = r_obj + place_err
  obj_h: 0.20                    # 물체 높이 상한
  R: 0.62                        # 물체 중심에서 카메라까지 원 반지름
  n_views: 24                    # 한 바퀴 시점 수
  crop_margin: 0.03              # 재구성 자르기 여유
  floor_cut: 0.005               # 이 높이 아래는 판으로 보고 자름

capture:
  color: {w: 1280, h: 720, fmt: rgb8, fps: 15}
  depth: {w: 1280, h: 720, fmt: f32, fps: 15}
  n_depth: 3                     # 스냅샷 한 번의 깊이 장수
  n_skip: 5                      # 자동 노출용으로 버리는 프레임 세트
  settle_s: 0.3                  # 이동을 마치고 스냅샷까지 기다림
  compress: true                 # 로봇이 zlib 무손실 압축해 보냄

drive:
  speed: 0.10                    # 직진 속도 m/s
  arc: true                      # 시점 이동을 원호 하나로(false면 회전 + 직진). 로봇 에이전트가 원호를 모르면 자동으로 회전 + 직진
  d_target: 0.45                 # 카메라–물체 거리 목표
  d_min: 0.40
  d_max: 0.55
  obstacle: true                 # LiDAR 장애물 판단
  sector_half_deg: 25            # 진행 방향 부채꼴 반폭
  start_clear: 0.30              # 이보다 가까우면 출발하지 않음
  stop_dist: 0.20                # 이동 중 이보다 가까우면 stop
  wait_s: 5.0                    # 막혔을 때 기다림
  bypass_lane: 0.25              # 우회 차선 폭
  scan_timeout_s: 0.5            # LiDAR 스캔이 이보다 오래되면 출발 안 함·정지
  pair_gap_tol_deg: 30           # 두 로봇 각도 차 180° ± 이 값이어야 시작
  block_timeout_s: 60            # 진입·보정·바깥 차선에서 막히거나 스캔이 끊긴 채 이보다 길면 중단

lidar:
  mount_yaw_deg: 180             # 스캔 각 0이 로봇 뒤쪽
  mask: []                       # 기둥에 가린 각도 범위

robots:
  L:
    host: 127.0.0.1
    port: 7010                   # 제어 연결
    stream_port: 7011            # odom·LiDAR 스트림 연결
    mount: {x: -0.08, y: 0.0, z: 0.15, pitch_down_deg: 15, yaw_deg: 90}
    wheel_radius: 0.027
    wheel_separation: 0.0961
  H:
    host: 127.0.0.1
    port: 7010
    stream_port: 7011
    mount: {x: -0.08, y: 0.0, z: 0.45, pitch_down_deg: 37, yaw_deg: 90}
    wheel_radius: 0.027
    wheel_separation: 0.0961

recon:
  voxel: 0.002
  trunc: 0.006
  edge_mm: 10                    # 3×3 이웃 깊이 차가 이보다 크면 물체 가장자리로 보고 지움(0이면 끔)
  color_opt_iter: 0              # >0이면 융합 뒤 시점 사진으로 꼭짓점 색을 다시 입힘(반복 횟수)

station:
  data_dir: scans
  show_mesh: true

webui:                           # 웹 화면(python -m scan3d.web, docs/specs/webui.md)
  split_z: 0.15                  # 보강 촬영: 이 높이 이상이거나 위를 향한 면이면 H가 찍는다
  up_deg: 45                     # 법선이 수평에서 이보다 위면 위를 향한 면
  focus_offsets_deg: [-10, 0, 10]   # 보강 촬영 각(마커를 보는 각 기준)
  transit_max_deg: 90            # 보강 촬영: 원호 문장을 아는 로봇이 원호 하나로 가는 최대 각(15면 15°씩 끊어 감)
  crop_px: [480, 360]            # 보강 사진에서 마커 둘레를 자르는 크기
