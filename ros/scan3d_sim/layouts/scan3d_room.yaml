# Gazebo 3D 스캔 시험용 3 m x 3 m 방 (pinky_sim_examples world_builder 형식)
# 텍스처 board.png는 tools/make_sim_assets.py가 만들고, scripts/sim_scan.sh가 이 파일을 그 옆에 복사해 world를 만든다.

world_name: scan3d_room
origin: [0.0, 0.0]
wall_height: 0.4

objects:
  # 3 m x 3 m 방 벽
  - {name: wall_north, type: wall, from: [-1.5,  1.5], to: [ 1.5,  1.5], thickness: 0.03}
  - {name: wall_south, type: wall, from: [-1.5, -1.5], to: [ 1.5, -1.5], thickness: 0.03}
  - {name: wall_west,  type: wall, from: [-1.5, -1.5], to: [-1.5,  1.5], thickness: 0.03}
  - {name: wall_east,  type: wall, from: [ 1.5, -1.5], to: [ 1.5,  1.5], thickness: 0.03}

  # 594 x 594 x 2 mm 표식 판 (gz-common CreateBox +Z 면 UV 회전 보정으로 yaw 90)
  - {name: marker_board, type: box, size: [0.594, 0.594, 0.002], at: [0.0, 0.0], yaw: 90, texture: board.png, color: [1.0, 1.0, 1.0]}

  # 중앙 스캔 상자: 표식 판(2 mm) 위 0.18 x 0.14 x 0.16 m, 면마다 다른 색(fake_agent BOX와 동일)
  - {name: target_core,  type: box, size: [0.176, 0.136, 0.162], at: [ 0.000,  0.000], color: [0.85, 0.85, 0.85]}
  - {name: target_pos_x, type: box, size: [0.002, 0.140, 0.162], at: [ 0.089,  0.000], color: [0.85, 0.10, 0.10]}
  - {name: target_neg_x, type: box, size: [0.002, 0.140, 0.162], at: [-0.089,  0.000], color: [0.10, 0.65, 0.15]}
  - {name: target_pos_y, type: box, size: [0.176, 0.002, 0.162], at: [ 0.000,  0.069], color: [0.10, 0.25, 0.85]}
  - {name: target_neg_y, type: box, size: [0.176, 0.002, 0.162], at: [ 0.000, -0.069], color: [0.90, 0.80, 0.10]}
